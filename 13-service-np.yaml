apiVersion: v1
kind: Service
metadata:
  name: nginx-np
  labels:
    app: nginx
    environment: dev
spec: 
  type: NodePort
  # Service uses following labels to select the appropriate pods
  selector:
    name: roboshop
    tier: frontend
    component: frontend
  ports:
    - protocol: TCP
      port: 80 #service port
      targetPort: 80 #container port